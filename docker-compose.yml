# Local dev Postgres for the Hetzner port.
# Matches the Coolify-provisioned Postgres 17 (vanilla, no Supabase image).
# Prod creds live in Coolify magic env vars — never reuse these locally for prod.
services:
  postgres:
    image: postgres:17
    container_name: voipa-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voipa
    ports:
      - "5432:5432"
    volumes:
      - voipa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voipa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voipa_pgdata:
